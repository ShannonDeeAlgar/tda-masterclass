project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "topics/**/*.ipynb"
    - "pause-and-take-stock/*.ipynb"
    - "!downloads/**"
    - "!archive/**"
  resources:
    - environment.yml
    - downloads/*.ipynb
    - downloads/*.csv
    - data/*.csv
    - data/*.npz
    - data/README.md
    - data/DATASAURUS-LICENSE.md
    - assets/*.html
    - scripts/*.jl
    - scripts/*.py

website:
  title: "TDA for Static and Dynamic Data"
  search: true
  bread-crumbs: false
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Course home
      - href: run-practicals.qmd
        text: Run notebooks
      - href: glossary.qmd
        text: Glossary
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - section: "Course orientation"
        contents:
          - href: index.qmd
            text: Course overview
          - href: reading-map.qmd
            text: Sources and data provenance
      - section: "Prelude: Why topology?"
        contents:
          - href: topics/topic-01/index.qmd
            text: "A · Shape and controlled forgetting"
          - href: topics/topic-01/topology-survival-guide.qmd
            text: "B · Topology in detail"
      - section: "Foundations: homology and filtered complexes"
        contents:
          - section: "1: Build K"
            contents:
              - href: topics/topic-02/index.qmd
                text: "1A · Why build a complex?"
              - href: topics/topic-02/detail.qmd
                text: "1B · Simplicial complexes"
          - section: "2: Homology of K"
            contents:
              - href: topics/topic-02/homology.qmd
                text: "2A · What homology records"
              - href: topics/topic-02/homology-detail.qmd
                text: "2B · Chains and boundary maps"
              - href: topics/topic-02/algebra-survival-guide.qmd
                text: "Optional algebra refresher"
          - section: "3: Filtration from (K, f)"
            contents:
              - href: topics/topic-03/index.qmd
                text: "3A · Why filtrations"
              - href: topics/topic-03/detail.qmd
                text: "3B · Constructing filtrations"
      - href: pause-and-take-stock/index.qmd
        text: "Pause and take stock"
      - section: "Foundations: persistent homology"
        contents:
          - section: "4: Persistent homology module"
            contents:
              - href: topics/topic-04/index.qmd
                text: "4A · Link homology across scale"
              - href: topics/topic-04/detail.qmd
                text: "4B · Modules in detail"
          - section: "5: Encode the module"
            contents:
              - href: topics/topic-04/summaries.qmd
                text: "5A · Barcodes and diagrams"
              - href: topics/topic-04/summaries-detail.qmd
                text: "5B · Decomposition and reduction"
      - section: "Practice and validation"
        contents:
          - section: "Working with outputs"
            contents:
              - href: topics/topic-05/index.qmd
                text: "Transform and compare"
          - section: "Dynamic data"
            contents:
              - href: topics/topic-06/index.qmd
                text: "Introduction · Relationships through change"
              - href: topics/topic-06/detail.qmd
                text: "Snapshot summaries"
              - href: topics/topic-06/correspondence-detail.qmd
                text: "Zigzags, vineyards and transport"
              - href: topics/topic-06/sw1pers.qmd
                text: "Optional · SW1PerS"
              - href: topics/topic-06/multiparameter.qmd
                text: "Optional · Multiparameter persistence"
format:
  html:
    css: assets/layout-fixes.css
    include-after-body:
      - assets/collapsible-examples.html
      - assets/course-spine.html
    theme:
      light: [cosmo, assets/site.scss]
      dark: [darkly, assets/site.scss]
    toc: true
    toc-location: left
    grid:
      sidebar-width: 240px
      body-width: 920px
      margin-width: 300px
      gutter-width: 1.5rem
    code-fold: true
    code-tools: true
    code-copy: true
    anchor-sections: true
    smooth-scroll: true

execute:
  enabled: false
  freeze: auto
  echo: true
  warning: false
  error: false

bibliography: references.bib
