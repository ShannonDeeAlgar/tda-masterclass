project:
  type: website
  output-dir: _site
  resources:
    - environment.yml
    - downloads/*.ipynb
    - downloads/*.csv
    - data/*.csv
    - data/README.md
    - data/DATASAURUS-LICENSE.md

website:
  title: "TDA for Static and Dynamic Data"
  search: true
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Course home
      - href: run-practicals.qmd
        text: Run notebooks
      - href: glossary.qmd
        text: Glossary
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - section: "Course orientation"
        contents:
          - href: index.qmd
            text: Course overview
          - href: reading-map.qmd
            text: Guiding texts and reading map
      - section: "Foundations"
        contents:
          - href: weeks/week-01/topology-survival-guide.qmd
            text: "Before Week 1: Topology survival guide"
          - weeks/week-01/index.qmd
          - href: weeks/week-02/algebra-survival-guide.qmd
            text: "Before Week 2: Algebra survival guide"
          - weeks/week-02/index.qmd
          - weeks/week-03/index.qmd
          - weeks/week-04/index.qmd
      - section: "Interlude"
        contents:
          - href: design-decisions/index.qmd
            text: "Every barcode has a modelling history"
      - section: "Practice and validation"
        contents:
          - weeks/week-05/index.qmd
          - weeks/week-06/index.qmd
      - section: "Dynamic data"
        contents:
          - weeks/week-07/index.qmd
          - weeks/week-08/index.qmd
      - section: "Application routes"
        contents:
          - href: applications/index.qmd
            text: "Overview"
          - applications/dynamical-systems.qmd
          - applications/industry-template.qmd

format:
  html:
    theme:
      light: [cosmo, assets/site.scss]
      dark: [darkly, assets/site.scss]
    toc: true
    code-fold: true
    code-tools: true
    code-copy: true
    anchor-sections: true
    smooth-scroll: true

execute:
  freeze: auto
  echo: true
  warning: false
  error: false

bibliography: references.bib
