<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mug–torus filtration explorer</title>
<style>
:root{--fg:#263746;--muted:#687887;--line:#477c9e;--surface:#7f9caf;--ref-long:#b56f8e;--ref-mer:#5b9d96;--h1:#7f8b96;--h2:#b36a16;--class-a:#7347b2;--class-b:#d0446d;--epsilon:#b47b0b;--alive:rgba(180,123,11,.10);--border:#9baab6;--face:rgba(36,90,122,.10)}
:root[data-theme="dark"]{--fg:#edf2f7;--muted:#bdc8d2;--line:#82b7d7;--surface:#779bb3;--ref-long:#d19ab1;--ref-mer:#88c4bd;--h1:#a8b3bd;--h2:#f1ad5b;--class-a:#c3a0ff;--class-b:#ff7da1;--epsilon:#f1c36b;--alive:rgba(241,195,107,.12);--border:#71808d;--face:rgba(130,183,215,.13)}
*{box-sizing:border-box}html,body{margin:0;background:transparent!important;color:var(--fg);font:16px system-ui,sans-serif}.wrap{border:1px solid var(--border);border-radius:14px;padding:14px;background:transparent!important}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.controls input[type=range]{flex:1;min-width:110px}.controls label{display:flex;align-items:center;gap:5px;font-size:.9rem}button,select{padding:.45rem .8rem;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--fg)}canvas{display:block;width:100%;height:auto;background:transparent!important}.caption{margin:.5rem .25rem 0;color:var(--muted);font-size:.92rem}
</style></head><body><div class="wrap">
<div class="controls"><button id="play">Play deformation</button><label style="flex:1">mug ⟷ torus <input id="slider" type="range" min="0" max="__MAX__" value="0" step="1" aria-label="deformation frame"></label><strong id="readout"></strong><label>Samples <select id="density"><option>18</option><option selected>28</option><option>38</option></select></label><label>Rotate <input id="azimuth" type="range" min="-180" max="180" value="-54" step="1" aria-label="horizontal rotation"></label><label>Tilt <input id="elevation" type="range" min="-70" max="70" value="23" step="1" aria-label="vertical tilt"></label></div>
<div class="controls"><label style="flex:1">filtration scale ε <input id="epsilon" type="range" min="0" max="__EPSMAX__" value="1.35" step="0.01" aria-label="Rips filtration scale"></label><strong id="epsreadout"></strong><label><input id="complex" type="checkbox" checked> show Rips edges and faces</label></div>
<canvas id="plot" width="1180" height="680"></canvas>
<p class="caption">Pause at any mug–torus configuration, then move ε independently. The deformation changes the observed coordinates; ε changes the Rips filtration built from those observations.</p></div>
<script>
const F=__DATA__,cv=document.getElementById("plot"),x=cv.getContext("2d"),s=document.getElementById("slider"),play=document.getElementById("play"),readout=document.getElementById("readout"),density=document.getElementById("density"),azimuth=document.getElementById("azimuth"),elevation=document.getElementById("elevation"),epsilon=document.getElementById("epsilon"),epsreadout=document.getElementById("epsreadout"),showComplex=document.getElementById("complex");let timer=null;
function syncTheme(){let dark=false;try{const root=parent.document.documentElement,body=parent.document.body;dark=root.getAttribute("data-bs-theme")==="dark"||body.classList.contains("quarto-dark")||root.classList.contains("quarto-dark")}catch(e){dark=matchMedia("(prefers-color-scheme: dark)").matches}document.documentElement.dataset.theme=dark?"dark":"light"}
syncTheme();try{new MutationObserver(()=>{syncTheme();draw()}).observe(parent.document.documentElement,{attributes:true,attributeFilter:["class","data-bs-theme"]});new MutationObserver(()=>{syncTheme();draw()}).observe(parent.document.body,{attributes:true,attributeFilter:["class"]})}catch(e){}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function proj(a){let X=a[0],Y=a[1],Z=a[2],az=+azimuth.value*Math.PI/180,el=+elevation.value*Math.PI/180,u=Math.cos(az)*X-Math.sin(az)*Y,v=Math.sin(az)*X+Math.cos(az)*Y,w=Math.cos(el)*v-Math.sin(el)*Z;return[295+u*75,285-w*75,Math.sin(el)*v+Math.cos(el)*Z]}
const allInts=F.flatMap(f=>Object.values(f.samples).flatMap(g=>[...g.intervals["1"],...g.intervals["2"]])),maxD=Math.max(...allInts.map(z=>z[1]))*1.1;
function pd(a,b){return[700+a/maxD*390,490-b/maxD*365]}
function distance(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])}
function alive(ints,e){return ints.filter(z=>z[0]<=e&&e<z[1]).length}
function path(points,col,w=3,dash=[]){x.strokeStyle=col;x.lineWidth=w;x.setLineDash(dash);x.beginPath();points.forEach((a,i)=>{let q=proj(a);i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])});x.stroke();x.setLineDash([])}
function draw(){let f=F[+s.value],M=f.mesh,S=f.samples[density.value],P=S.points,e=+epsilon.value,Q=P.map(proj);x.clearRect(0,0,1180,680);x.fillStyle=css("--fg");x.font="700 21px system-ui";x.fillText(+s.value===0?"Mug boundary surface":+s.value===F.length-1?"Torus boundary surface":"One continuous surface deformation",55,34);x.fillText("H₁ and H₂ persistence diagrams",700,34);
x.strokeStyle=css("--surface");x.lineWidth=1;x.globalAlpha=.62;for(let i=0;i<M.length;i++){x.beginPath();for(let j=0;j<=M[i].length;j++){let q=proj(M[i][j%M[i].length]);j?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])}x.stroke()}for(let j=0;j<M[0].length;j++){x.beginPath();for(let i=0;i<=M.length;i++){let q=proj(M[i%M.length][j]);i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])}x.stroke()}x.globalAlpha=1;
path(f.cycles.longitude,css("--muted"),1.8,[7,5]);path(f.cycles.meridian,css("--muted"),1.8,[7,5]);
if(showComplex.checked){x.fillStyle=css("--face");for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++)for(let k=j+1;k<P.length;k++)if(Math.max(distance(P[i],P[j]),distance(P[i],P[k]),distance(P[j],P[k]))<=e){x.beginPath();x.moveTo(Q[i][0],Q[i][1]);x.lineTo(Q[j][0],Q[j][1]);x.lineTo(Q[k][0],Q[k][1]);x.closePath();x.fill()}x.strokeStyle=css("--line");x.lineWidth=.65;for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++)if(distance(P[i],P[j])<=e){x.beginPath();x.moveTo(Q[i][0],Q[i][1]);x.lineTo(Q[j][0],Q[j][1]);x.stroke()}}
let live=S.birth_cycles.filter(z=>z.birth<=e&&e<z.death).sort((a,b)=>(b.death-b.birth)-(a.death-a.birth)).slice(0,2),classCols=[css("--class-a"),css("--class-b")];live.forEach((born,k)=>{x.strokeStyle=classCols[k];x.lineWidth=4.5;x.globalAlpha=.98;for(const edge of born.edges){x.beginPath();x.moveTo(Q[edge[0]][0],Q[edge[0]][1]);x.lineTo(Q[edge[1]][0],Q[edge[1]][1]);x.stroke()}let edge=born.edges[0],mx=(Q[edge[0]][0]+Q[edge[1]][0])/2,my=(Q[edge[0]][1]+Q[edge[1]][1])/2;x.fillStyle=classCols[k];x.font="700 18px system-ui";x.fillText(k===0?"A":"B",mx+5,my-5);x.globalAlpha=1});
Q.slice().sort((a,b)=>a[2]-b[2]).forEach(q=>{x.beginPath();x.arc(q[0],q[1],4.2,0,2*Math.PI);x.fillStyle=css("--fg");x.fill();x.strokeStyle=css("--line");x.lineWidth=1.4;x.stroke()});x.font="14px system-ui";x.fillStyle=css("--muted");x.fillText("dashed curves are geometric guides, not sampled classes alive at ε",55,535);
let ex=Math.max(700,Math.min(1090,pd(e,e)[0])),ey=Math.max(125,Math.min(490,pd(e,e)[1]));x.fillStyle=css("--alive");x.fillRect(700,125,ex-700,ey-125);x.strokeStyle=css("--epsilon");x.lineWidth=1.4;x.setLineDash([5,4]);x.beginPath();x.moveTo(ex,125);x.lineTo(ex,490);x.moveTo(700,ey);x.lineTo(1090,ey);x.stroke();x.setLineDash([]);x.fillStyle=css("--epsilon");x.font="13px system-ui";x.fillText("classes alive at ε lie in this shaded region",715,145);
x.strokeStyle=css("--muted");x.setLineDash([6,5]);let a=pd(0,0),b=pd(maxD,maxD);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();x.setLineDash([]);S.intervals["1"].forEach(z=>{let k=live.findIndex(c=>Math.abs(c.birth-z[0])<1e-4&&Math.abs(c.death-z[1])<1e-4),q=pd(z[0],z[1]);x.beginPath();x.arc(q[0],q[1],k>=0?8:5,0,2*Math.PI);x.fillStyle=k>=0?classCols[k]:css("--h1");x.globalAlpha=k>=0?1:.42;x.fill();x.globalAlpha=1;if(k>=0){x.fillStyle=classCols[k];x.font="700 17px system-ui";x.fillText(k===0?"A":"B",q[0]+9,q[1]-7)}});S.intervals["2"].forEach(z=>{let isLive=z[0]<=e&&e<z[1],q=pd(z[0],z[1]);x.beginPath();x.arc(q[0],q[1],isLive?7:5,0,2*Math.PI);x.fillStyle=isLive?css("--h2"):css("--h1");x.globalAlpha=isLive?1:.42;x.fill();x.globalAlpha=1});x.strokeStyle=css("--fg");x.lineWidth=1.5;x.beginPath();x.moveTo(700,490);x.lineTo(1090,490);x.moveTo(700,490);x.lineTo(700,125);x.stroke();x.fillStyle=css("--fg");x.font="15px system-ui";x.fillText("birth ε",1035,522);x.save();x.translate(665,175);x.rotate(-Math.PI/2);x.fillText("death ε",0,0);x.restore();
let b0=1+alive(S.intervals["0"],e),b1=alive(S.intervals["1"],e),b2=alive(S.intervals["2"],e);x.fillStyle=css("--fg");x.fillText(`at ε = ${e.toFixed(2)}:  β₀=${b0},  β₁=${b1},  β₂=${b2}`,720,75);x.fillStyle=css("--h1");x.fillText("● inactive sampled intervals",720,100);if(b2){x.fillStyle=css("--h2");x.fillText("● H₂ alive now",925,100)}x.fillStyle=css("--muted");x.fillText("continuous surface reference: β₀=1, β₁=2, β₂=1",720,555);x.fillText("diagram coordinates depend on metric, sampling and filtration",720,580);x.fillText("solid material reference: β₀=1, β₁=1, β₂=0",720,605);x.fillText("surface model: two loop generators and one closed-surface class",55,570);x.fillText("solid model: one tunnel class; its cross-section is filled",55,595);if(live.length){live.forEach((born,k)=>{x.fillStyle=classCols[k];x.fillText(`${k===0?"A":"B"}: sampled H₁ cycle born ${born.birth.toFixed(2)}, dies ${born.death.toFixed(2)}`,55,620+k*22)})}else{x.fillStyle=css("--muted");x.fillText("no positive-lifetime H₁ class is alive at this ε",55,630)}readout.textContent=`deformation t = ${f.t.toFixed(2)}`;epsreadout.textContent=`ε = ${e.toFixed(2)}`}
[s,density,azimuth,elevation,epsilon,showComplex].forEach(e=>e.addEventListener("input",draw));play.addEventListener("click",()=>{if(timer){clearInterval(timer);timer=null;play.textContent="Play deformation";return}play.textContent="Pause deformation";timer=setInterval(()=>{s.value=(+s.value+1)%F.length;draw()},150)});matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{syncTheme();draw()});draw();
</script></body></html>
