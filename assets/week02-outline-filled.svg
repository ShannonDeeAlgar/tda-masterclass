<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="title desc"><title id="title">Outline and filled triangle complexes</title><desc id="desc">Two complexes share the same vertices and edges. The outline triangle has a one-cycle not in the boundary space; the filled triangle includes a two-simplex whose boundary is that cycle.</desc><defs><style>.e{stroke:#222;stroke-width:2.5;fill:none}.f{fill:#dbe8f3;stroke:#222;stroke-width:2.5}.n{fill:#222}.head{font:22px Georgia,serif;fill:#111}.math{font:18px Georgia,serif;fill:#333}</style></defs><rect width="820" height="300" fill="#fff"/><text class="head" x="120" y="35">outline complex</text><path class="e" d="M80 225 L200 65 L320 225 Z"/><circle class="n" cx="80" cy="225" r="5"/><circle class="n" cx="200" cy="65" r="5"/><circle class="n" cx="320" cy="225" r="5"/><text class="math" x="75" y="270">z ∈ Z₁ but z ∉ B₁</text><path d="M380 145 H440" stroke="#777" stroke-width="1.5"/><text class="math" x="385" y="132">add [012]</text><text class="head" x="540" y="35">filled complex</text><path class="f" d="M500 225 L620 65 L740 225 Z"/><circle class="n" cx="500" cy="225" r="5"/><circle class="n" cx="620" cy="65" r="5"/><circle class="n" cx="740" cy="225" r="5"/><text class="math" x="530" y="270">z = ∂₂[012] ∈ B₁</text><text class="math" x="282" y="294">same 1-skeleton; different simplicial complex</text></svg>
