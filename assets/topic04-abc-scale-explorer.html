<div id="abc-scale-explorer" class="abc-explorer">
  <div class="abc-controls">
    <button id="abc-play" type="button">Play</button>
    <label for="abc-scale">closeness scale ε</label>
    <input id="abc-scale" type="range" min="0" max="100" value="0" step="1">
    <output id="abc-value" for="abc-scale">ε = 0.00</output>
  </div>
  <svg id="abc-view" viewBox="0 0 700 430" role="img" aria-labelledby="abc-title abc-desc">
    <title id="abc-title">The same C-shaped marks viewed across scale</title>
    <desc id="abc-desc">At fine resolution the individual Cs are visible. As the scale is relaxed, groups read as Bs and the full arrangement reads as an A.</desc>
    <g id="abc-data"></g>
  </svg>
  <div id="abc-status" aria-live="polite">Fine scale: individual Cs are visible.</div>
</div>

<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; background: transparent; }
  .abc-explorer {
    color: CanvasText;
    font: 16px/1.35 system-ui, sans-serif;
    background: transparent;
  }
  .abc-controls {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-bottom: 0.35rem;
  }
  .abc-controls button { font: inherit; padding: 0.35rem 0.8rem; }
  .abc-controls label { font-weight: 600; }
  .abc-controls input { flex: 1 1 260px; accent-color: #267f82; }
  .abc-controls output { min-width: 5.6rem; font-variant-numeric: tabular-nums; }
  #abc-view { display: block; width: 100%; height: auto; overflow: visible; }
  #abc-data { transform-origin: center; }
  #abc-data text {
    fill: #287f82;
    font: 700 18px system-ui, sans-serif;
    text-anchor: middle;
    dominant-baseline: central;
  }
  #abc-status {
    min-height: 1.5rem;
    text-align: center;
    font-weight: 600;
  }
  @media (max-width: 520px) {
    .abc-controls { align-items: stretch; }
    .abc-controls input { flex-basis: 100%; }
  }
</style>

<script>
(() => {
  const root = document.getElementById("abc-scale-explorer");
  const data = root.querySelector("#abc-data");
  const slider = root.querySelector("#abc-scale");
  const output = root.querySelector("#abc-value");
  const status = root.querySelector("#abc-status");
  const play = root.querySelector("#abc-play");
  const ns = "http://www.w3.org/2000/svg";

  const inner = [
    [0,0],[0,22],[0,44],[0,66],[0,88],
    [22,0],[42,5],[50,23],[22,44],[43,44],
    [50,65],[42,85],[22,88]
  ];
  const outer = [
    [350,35,0.82],[292,105,0.82],[408,105,0.82],
    [235,183,0.82],[465,183,0.82],[182,263,0.82],
    [518,263,0.82],[300,225,0.78],[400,225,0.78],
    [125,340,0.82],[575,340,0.82]
  ];

  for (const [ox, oy, scale] of outer) {
    for (const [ix, iy] of inner) {
      const mark = document.createElementNS(ns, "text");
      mark.setAttribute("x", ox + ix * scale);
      mark.setAttribute("y", oy + iy * scale);
      mark.textContent = "C";
      data.appendChild(mark);
    }
  }

  let timer = null;
  function update() {
    const value = Number(slider.value);
    const epsilon = value / 100;
    output.value = `ε = ${epsilon.toFixed(2)}`;
    data.style.filter = `blur(${(epsilon * 7.5).toFixed(2)}px)`;
    if (value < 34) status.textContent = "Fine scale: individual Cs are visible.";
    else if (value < 68) status.textContent = "Intermediate scale: nearby Cs resolve as B-shaped groups.";
    else status.textContent = "Coarse scale: the groups resolve as one A-shaped organisation.";
  }

  function stop() {
    if (timer !== null) window.clearInterval(timer);
    timer = null;
    play.textContent = "Play";
  }

  play.addEventListener("click", () => {
    if (timer !== null) { stop(); return; }
    if (Number(slider.value) >= 100) slider.value = "0";
    play.textContent = "Pause";
    timer = window.setInterval(() => {
      const next = Number(slider.value) + 1;
      slider.value = String(Math.min(100, next));
      update();
      if (next >= 100) stop();
    }, 55);
  });
  slider.addEventListener("input", update);
  update();
})();
</script>
