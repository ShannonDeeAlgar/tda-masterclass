<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 430" role="img" aria-labelledby="title desc">
<title id="title">Edge boundaries become matrix columns</title><desc id="desc">Edges e01 e12 e02 map to endpoint coordinate vectors which form the columns of the boundary matrix.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245b8a"/></marker><style>.edge{stroke:#222;stroke-width:2;fill:none}.node{fill:#fff;stroke:#222;stroke-width:1.7}.head{font:22px Georgia,serif;fill:#111}.lab{font:italic 19px Georgia,serif;fill:#111}.vec{font:26px Georgia,serif;fill:#111}.note{font:17px Georgia,serif;fill:#444}</style></defs><rect width="1020" height="430" fill="#fff"/>
<text class="head" x="35" y="40">basis edge</text><text class="head" x="326" y="40">boundary coordinates in (v₀,v₁,v₂)</text><text class="head" x="792" y="40">[∂₁]</text>
<g transform="translate(30 65)"><g transform="translate(0 0)"><path class="edge" d="M25 55 H175"/><circle class="node" cx="25" cy="55" r="5"/><circle class="node" cx="175" cy="55" r="5"/><text class="lab" x="91" y="43">e₀₁</text></g><g transform="translate(0 115)"><path class="edge" d="M25 55 H175"/><circle class="node" cx="25" cy="55" r="5"/><circle class="node" cx="175" cy="55" r="5"/><text class="lab" x="91" y="43">e₁₂</text></g><g transform="translate(0 230)"><path class="edge" d="M25 55 H175"/><circle class="node" cx="25" cy="55" r="5"/><circle class="node" cx="175" cy="55" r="5"/><text class="lab" x="91" y="43">e₀₂</text></g></g>
<path d="M230 120 H315 M230 235 H315 M230 350 H315" stroke="#245b8a" stroke-width="1.8" marker-end="url(#arrow)"/>
<g class="vec"><text x="350" y="99">⎛1⎞</text><text x="350" y="126">⎜1⎟</text><text x="350" y="153">⎝0⎠</text><text x="350" y="214">⎛0⎞</text><text x="350" y="241">⎜1⎟</text><text x="350" y="268">⎝1⎠</text><text x="350" y="329">⎛1⎞</text><text x="350" y="356">⎜0⎟</text><text x="350" y="383">⎝1⎠</text></g>
<text class="note" x="425" y="126">column 1</text><text class="note" x="425" y="241">column 2</text><text class="note" x="425" y="356">column 3</text>
<path d="M525 120 C625 120 660 150 735 170 M525 235 C625 235 660 215 735 205 M525 350 C625 350 660 280 735 240" fill="none" stroke="#777" stroke-width="1.3" stroke-dasharray="5 5"/>
<g font-family="Georgia,serif" fill="#111"><text x="720" y="105" font-size="18">columns e₀₁, e₁₂, e₀₂</text><text x="742" y="180" font-size="31">⎛1  0  1⎞</text><text x="742" y="215" font-size="31">⎜1  1  0⎟</text><text x="742" y="250" font-size="31">⎝0  1  1⎠</text><text x="753" y="283" font-size="18">rows v₀, v₁, v₂</text></g>
<text class="note" x="205" y="416">Each column is the coordinate vector of the boundary of one edge.</text>
</svg>
