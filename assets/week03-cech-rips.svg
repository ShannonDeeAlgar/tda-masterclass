<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc"><title id="title">Čech and Rips constructions on three points</title><desc id="desc">Three balls have pairwise intersections but no common triple intersection, while the Rips pairwise test fills a triangle.</desc><defs><style>.ball{fill:#dbe8f3;fill-opacity:.55;stroke:#245b8a;stroke-width:1.8}.edge{stroke:#222;stroke-width:2;fill:none}.face{fill:#e9dff3;stroke:#6b4ca5;stroke-width:2}.node{fill:#222}.head{font:23px Georgia,serif;fill:#111}.note{font:17px Georgia,serif;fill:#444}</style></defs><rect width="900" height="340" fill="#fff"/><text class="head" x="130" y="35">Čech: common intersections</text><circle class="ball" cx="170" cy="205" r="92"/><circle class="ball" cx="310" cy="205" r="92"/><circle class="ball" cx="240" cy="85" r="92"/><circle class="node" cx="170" cy="205" r="5"/><circle class="node" cx="310" cy="205" r="5"/><circle class="node" cx="240" cy="85" r="5"/><text class="note" x="108" y="315">pairwise overlap; no triple overlap</text><path d="M445 40 V300" stroke="#bbb" stroke-width="1"/><text class="head" x="555" y="35">Rips: pairwise distances</text><path class="face" d="M560 245 L790 245 L675 72 Z"/><circle class="node" cx="560" cy="245" r="5"/><circle class="node" cx="790" cy="245" r="5"/><circle class="node" cx="675" cy="72" r="5"/><text class="note" x="535" y="315">all three edges imply a filled 2-simplex</text></svg>
