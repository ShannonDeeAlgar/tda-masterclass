<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">One pattern seen at three resolutions</title>
  <desc id="desc">Individual letter Cs form clusters shaped like Bs, and those B clusters form one large letter A. Three labelled views show how the visible organisation changes with viewing resolution.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#f0f4f6"/>
    </linearGradient>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61a6a2"/><stop offset=".52" stop-color="#3f8585"/><stop offset="1" stop-color="#236f73"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#21313b" flood-opacity=".14"/>
    </filter>
    <style>
      .heading{font:700 31px Inter,Arial,sans-serif;fill:#263746}.sub{font:16px Inter,Arial,sans-serif;fill:#647583}.view-title{font:700 19px Inter,Arial,sans-serif;fill:#263746}.view-copy{font:15px Inter,Arial,sans-serif;fill:#687887}.c{font:750 18px Inter,Arial,sans-serif;fill:#3f8585}.c-big{font:750 122px Inter,Arial,sans-serif;fill:#3f8585}.b-big{font:750 118px Inter,Arial,sans-serif;fill:#317a7c}.a-big{font:750 118px Inter,Arial,sans-serif;fill:#236f73}.chip{font:700 15px Inter,Arial,sans-serif;fill:white}.micro-label{font:700 14px Inter,Arial,sans-serif;letter-spacing:.08em;fill:#687887}.guide{stroke:#91a0aa;stroke-width:1.5;stroke-dasharray:5 6;fill:none}.b-outline{fill:#317a7c;fill-opacity:.07;stroke:#317a7c;stroke-opacity:.34;stroke-width:1.5}.a-guide{fill:none;stroke:#267b7f;stroke-opacity:.16;stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <g id="b-data">
      <!-- a strong vertical spine -->
      <text class="c" x="0" y="5">C</text><text class="c" x="0" y="26">C</text><text class="c" x="0" y="47">C</text><text class="c" x="0" y="68">C</text><text class="c" x="0" y="89">C</text>
      <!-- top, middle and bottom strokes, with two rounded bowls -->
      <text class="c" x="20" y="5">C</text><text class="c" x="39" y="10">C</text><text class="c" x="45" y="27">C</text>
      <text class="c" x="20" y="47">C</text><text class="c" x="39" y="47">C</text>
      <text class="c" x="46" y="66">C</text><text class="c" x="38" y="85">C</text><text class="c" x="19" y="89">C</text>
    </g>
    <g id="b-legend">
      <path class="b-outline" d="M-7,-13 H25 C48,-13 57,-1 57,14 C57,25 50,33 39,37 C52,41 60,50 60,64 C60,81 48,92 25,92 H-7 Z"/>
      <use href="#b-data"/>
    </g>
  </defs>

  <rect x="18" y="18" width="1164" height="564" rx="30" fill="url(#paper)" stroke="#d6dee3"/>
  <g transform="translate(75 50)" filter="url(#shadow)">
    <rect width="650" height="500" rx="25" fill="#fff" stroke="#d8e0e5"/>
    <g class="main-pattern" transform="translate(0 -45)"><g transform="translate(298 100) scale(.76)"><use href="#b-data"/></g>
    <g transform="translate(245 180) scale(.76)"><use href="#b-data"/></g><g transform="translate(352 180) scale(.76)"><use href="#b-data"/></g>
    <g transform="translate(193 264) scale(.76)"><use href="#b-data"/></g><g transform="translate(405 264) scale(.76)"><use href="#b-data"/></g>
    <g transform="translate(145 348) scale(.76)"><use href="#b-data"/></g><g transform="translate(453 348) scale(.76)"><use href="#b-data"/></g>
    <g transform="translate(254 300) scale(.72)"><use href="#b-data"/></g><g transform="translate(344 300) scale(.72)"><use href="#b-data"/></g>
    <g transform="translate(103 425) scale(.76)"><use href="#b-data"/></g><g transform="translate(496 425) scale(.76)"><use href="#b-data"/></g></g>
  </g>

  <g transform="translate(750 50)">
    <g filter="url(#shadow)"><rect width="390" height="140" rx="22" fill="#fff" stroke="#d8e0e5"/></g>
    <circle cx="35" cy="32" r="17" fill="#61a6a2"/><text class="chip" x="30" y="38">1</text>
    <text class="view-title" x="64" y="35">Close view</text>
    <text class="view-copy" x="64" y="70">one of 143 Cs</text>
    <text class="c-big" x="292" y="124">C</text>
  </g>
  <g transform="translate(750 220)">
    <g filter="url(#shadow)"><rect width="390" height="140" rx="22" fill="#fff" stroke="#d8e0e5"/></g>
    <circle cx="35" cy="32" r="17" fill="#3f8585"/><text class="chip" x="30" y="38">2</text>
    <text class="view-title" x="64" y="35">Step back</text>
    <text class="view-copy" x="64" y="70">one of 11 B-shaped groups</text>
    <g transform="translate(292 48) scale(.82)"><use href="#b-legend"/></g>
  </g>
  <g transform="translate(750 390)">
    <g filter="url(#shadow)"><rect width="390" height="140" rx="22" fill="#fff" stroke="#d8e0e5"/></g>
    <circle cx="35" cy="32" r="17" fill="#236f73"/><text class="chip" x="30" y="38">3</text>
    <text class="view-title" x="64" y="35">Across the room</text>
    <text class="view-copy" x="64" y="70">one A-shaped organisation</text>
    <text class="a-big" x="292" y="124">A</text>
  </g>

  <path class="guide" d="M725 115 H750 M725 285 H750 M725 455 H750"/>
</svg>
