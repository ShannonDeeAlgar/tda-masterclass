<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Geometry and topology compare different properties</title><desc id="desc">Circle and ellipse have different geometry but the same topology; circle and figure eight have different loop structure; a ring boundary and filled disk differ by a hole.</desc><defs><style>.shape{fill:none;stroke:#222;stroke-width:2.5}.fill{fill:#dbe8f3;stroke:#222;stroke-width:2.5}.head{font:21px Georgia,serif;fill:#111}.note{font:17px Georgia,serif;fill:#444}</style></defs><rect width="960" height="300" fill="#fff"/><text class="head" x="87" y="35">different geometry, same topology</text><circle class="shape" cx="105" cy="140" r="55"/><ellipse class="shape" cx="285" cy="140" rx="85" ry="48"/><text class="note" x="92" y="225">circle</text><text class="note" x="260" y="225">ellipse</text><path d="M170 140 H200" stroke="#245b8a" stroke-width="1.5"/><text class="head" x="404" y="35">different topology</text><circle class="shape" cx="455" cy="140" r="55"/><path class="shape" d="M620 140 C560 72 552 208 620 140 C688 72 680 208 620 140"/><text class="note" x="432" y="225">one loop</text><text class="note" x="588" y="225">two loops</text><text class="head" x="742" y="35">boundary versus filling</text><circle class="shape" cx="775" cy="140" r="55"/><circle class="fill" cx="895" cy="140" r="55"/><text class="note" x="754" y="225">hole</text><text class="note" x="871" y="225">no hole</text></svg>
