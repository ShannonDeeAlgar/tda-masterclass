<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" role="img" aria-labelledby="title desc">
  <title id="title">Torus and wedge comparison</title>
  <desc id="desc">A torus is shown beside two circles and a sphere joined at a common point.</desc>
  <defs>
    <style>
      .panel { fill: #fbfbfa; stroke: #777; stroke-width: 1.5; }
      .line { fill: none; stroke: #292929; stroke-width: 3; }
      .soft { fill: #dce8f4; stroke: #255a92; stroke-width: 2.5; }
      .hidden { fill: none; stroke: #777; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .label { font: 20px Georgia, serif; fill: #222; }
      .small { font: 16px Georgia, serif; fill: #444; }
    </style>
  </defs>

  <g transform="translate(10 10)">
    <rect class="panel" width="430" height="310" rx="8"/>
    <text class="label" x="215" y="36" text-anchor="middle">torus T²</text>
    <ellipse class="soft" cx="215" cy="160" rx="145" ry="92"/>
    <ellipse fill="#fbfbfa" stroke="#255a92" stroke-width="2.5" cx="215" cy="160" rx="58" ry="30"/>
    <path class="hidden" d="M74 160 C105 225 325 225 356 160"/>
    <path class="line" d="M74 160 C105 95 325 95 356 160"/>
    <text class="small" x="215" y="282" text-anchor="middle">two loop directions and one enclosed surface class</text>
  </g>

  <g transform="translate(460 10)">
    <rect class="panel" width="510" height="310" rx="8"/>
    <text class="label" x="255" y="36" text-anchor="middle">wedge S¹ ∨ S¹ ∨ S²</text>
    <circle class="line" cx="185" cy="185" r="70"/>
    <circle class="line" cx="325" cy="185" r="70"/>
    <circle class="soft" cx="255" cy="105" r="58"/>
    <ellipse class="hidden" cx="255" cy="105" rx="58" ry="18"/>
    <circle cx="255" cy="185" r="6" fill="#9b2c2c"/>
    <line x1="255" y1="191" x2="255" y2="230" stroke="#9b2c2c" stroke-width="1.5"/>
    <text class="small" x="255" y="253" text-anchor="middle">one shared wedge point</text>
    <text class="small" x="145" y="285">circle</text>
    <text class="small" x="318" y="285">circle</text>
    <text class="small" x="340" y="95">sphere</text>
  </g>
</svg>
