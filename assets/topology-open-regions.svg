<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">Open regions and the topology axioms</title>
  <desc id="desc">Four panels show a whole surface, two overlapping open regions, their union and their intersection.</desc>
  <defs>
    <style>
      .panel { fill: #fbfbfa; stroke: #777; stroke-width: 1.5; }
      .surface { fill: #f2f0ea; stroke: #292929; stroke-width: 2.2; }
      .u { fill: #5b8fc9; fill-opacity: .48; stroke: #255a92; stroke-width: 2; stroke-dasharray: 6 4; }
      .v { fill: #d49a45; fill-opacity: .48; stroke: #9a5c12; stroke-width: 2; stroke-dasharray: 6 4; }
      .both { fill: #7462a8; fill-opacity: .72; stroke: #533d88; stroke-width: 2; stroke-dasharray: 6 4; }
      .label { font: 18px Georgia, serif; fill: #222; }
      .small { font: 15px Georgia, serif; fill: #444; }
    </style>
    <clipPath id="clip-surface"><ellipse cx="0" cy="0" rx="105" ry="72"/></clipPath>
  </defs>

  <g transform="translate(10 10)">
    <rect class="panel" width="260" height="280" rx="8"/>
    <text class="label" x="130" y="32" text-anchor="middle">whole space X</text>
    <ellipse class="surface" cx="130" cy="145" rx="105" ry="72"/>
    <circle cx="120" cy="135" r="4" fill="#222"/>
    <circle cx="120" cy="135" r="22" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text class="small" x="130" y="245" text-anchor="middle">every point has room within X</text>
  </g>

  <g transform="translate(290 10)">
    <rect class="panel" width="260" height="280" rx="8"/>
    <text class="label" x="130" y="32" text-anchor="middle">open patches U and V</text>
    <ellipse class="surface" cx="130" cy="145" rx="105" ry="72"/>
    <ellipse class="u" cx="103" cy="142" rx="64" ry="43"/>
    <ellipse class="v" cx="157" cy="142" rx="64" ry="43"/>
    <text class="label" x="75" y="145">U</text>
    <text class="label" x="178" y="145">V</text>
    <text class="small" x="130" y="245" text-anchor="middle">each patch has breathing room</text>
  </g>

  <g transform="translate(570 10)">
    <rect class="panel" width="260" height="280" rx="8"/>
    <text class="label" x="130" y="32" text-anchor="middle">union U ∪ V</text>
    <ellipse class="surface" cx="130" cy="145" rx="105" ry="72"/>
    <ellipse class="u" cx="103" cy="142" rx="64" ry="43"/>
    <ellipse class="u" cx="157" cy="142" rx="64" ry="43"/>
    <circle cx="72" cy="142" r="4" fill="#222"/>
    <circle cx="72" cy="142" r="16" fill="none" stroke="#255a92" stroke-width="1.5"/>
    <text class="small" x="130" y="245" text-anchor="middle">room comes from U or V</text>
  </g>

  <g transform="translate(850 10)">
    <rect class="panel" width="260" height="280" rx="8"/>
    <text class="label" x="130" y="32" text-anchor="middle">intersection U ∩ V</text>
    <ellipse class="surface" cx="130" cy="145" rx="105" ry="72"/>
    <ellipse class="u" cx="103" cy="142" rx="64" ry="43"/>
    <ellipse class="v" cx="157" cy="142" rx="64" ry="43"/>
    <path class="both" d="M130 100 C151 108 167 122 167 142 C167 162 151 176 130 184 C109 176 93 162 93 142 C93 122 109 108 130 100 Z"/>
    <circle cx="130" cy="142" r="4" fill="#222"/>
    <circle cx="130" cy="142" r="13" fill="none" stroke="#533d88" stroke-width="1.5"/>
    <text class="small" x="130" y="245" text-anchor="middle">a smaller region fits inside both</text>
  </g>
</svg>
