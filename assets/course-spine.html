<script>
function initialiseCourseSpine() {
  if (document.querySelector(".course-spine")) return;
  const path = window.location.pathname;
  if (/lab\.html$/.test(path)) return;

  const match = path.match(/\/topics\/topic-(\d{2})\//);
  const topic = match ? Number(match[1]) : null;
  const isPause = path.includes("/pause-and-take-stock/");
  const isDetail = /\/(detail|correspondence-detail|homology-detail|summaries-detail|topology-survival-guide|algebra-survival-guide)\.html$/.test(path);
  const offset = document.querySelector('meta[name="quarto:offset"]')?.content || "";

  const stages = [
    { label: "Represent and build K", math: "data + constructor → K", short: "Build K", href: `${offset}topics/topic-02/index.html` },
    { label: "Homology of K", math: "K → H<sub>p</sub>(K; 𝔽)", short: "Homology", href: `${offset}topics/topic-02/homology.html` },
    { label: "Choose f and filter K", math: "f: K → ℝ; K<sub>a</sub> ⊆ K<sub>b</sub>", short: "Filtration", href: `${offset}topics/topic-03/index.html` },
    { label: "Persistent homology", math: "φ<sub>a,b</sub> = H<sub>p</sub>(ι<sub>a,b</sub>): V<sub>a</sub> → V<sub>b</sub>", short: "Across scale", href: `${offset}topics/topic-04/index.html` },
    { label: "Summarise the module", math: "V ≅ ⨁ I<sub>[bℓ,dℓ)</sub>; Bar<sub>p</sub>(V), Dgm<sub>p</sub>(V)", short: "Barcode/diagram", href: `${offset}topics/topic-04/summaries.html` }
  ];

  const purposes = {
    1: "Decide what K must represent and which relationships the construction must retain.",
    2: "Build the homology calculation that will be applied to every complex in the filtration.",
    3: "Relax one stated rule to construct nested complexes across scale.",
    4: "Follow what homology classes become as the scale increases.",
    5: "Decompose the module into feature lifespans and display those intervals as a barcode or persistence diagram."
  };

  let active = 0;
  let revisited = [];
  if (path.includes("/topics/topic-02/homology")) active = 2;
  else if (path.includes("/topics/topic-02/")) active = 1;
  else if (path.includes("/topics/topic-03/")) active = 3;
  else if (path.includes("/topics/topic-04/summaries")) active = 5;
  else if (path.includes("/topics/topic-04/")) active = 4;
  else if ((topic && topic >= 5) || isPause) active = 6;

  if (isPause) revisited = [1, 3];
  else if (topic === 5) revisited = [5];
  else if (topic === 6 && path.includes("correspondence")) revisited = [3, 4];
  else if (topic === 6) revisited = [1, 2, 3, 4, 5];

  let purpose = active >= 1 && active <= 5
    ? purposes[active]
    : topic === 5
      ? "Start from the barcode or diagram, then choose a deliberate comparison or transformation."
      : topic === 6
        ? path.includes("correspondence")
          ? "Enrich the filtration and homology stages with justified relationships through external time."
          : "Repeat the five-stage construction at each snapshot or time window, without assuming feature correspondence."
        : isPause
              ? "Audit the representation, constructor and filtration before treating their output as evidence."
              : "The foundation stages build a filtered object, then persistent homology and its interval encoding.";

  const wrapper = document.createElement("div");
  wrapper.className = "course-spine";
  wrapper.setAttribute("aria-label", "Persistent homology course spine");

  const inner = document.createElement("div");
  inner.className = "course-spine-inner";

  const heading = document.createElement("div");
  heading.className = "course-spine-heading";
  heading.innerHTML = `<span>Course spine</span>${isDetail ? '<span class="course-spine-detail">detail</span>' : ""}`;

  const nav = document.createElement("nav");
  nav.className = "course-spine-stages";
  nav.setAttribute("aria-label", "Stages in the persistent homology construction");

  const stageLinks = stages.map((stage, index) => {
    const number = index + 1;
    const link = document.createElement("a");
    link.href = stage.href;
    link.className = "course-spine-stage";
    link.dataset.stage = String(number);
    link.innerHTML = `<span class="course-spine-number">${number}</span><span class="course-spine-copy"><span class="course-spine-label">${stage.label}</span><span class="course-spine-math">${stage.math}</span></span>`;
    nav.appendChild(link);
    return link;
  });

  const why = document.createElement("div");
  why.className = "course-spine-why";

  const mobile = document.createElement("details");
  mobile.className = "course-spine-mobile";
  const mobileSummary = document.createElement("summary");
  const mobileBody = document.createElement("div");
  mobileBody.className = "course-spine-mobile-body";
  mobileBody.append(nav.cloneNode(true));
  mobile.append(mobileSummary, mobileBody);

  inner.append(heading, nav, why, mobile);
  wrapper.appendChild(inner);

  const content = document.querySelector("#quarto-content");
  if (!content) return;
  content.parentNode.insertBefore(wrapper, content);

  const spacer = document.createElement("div");
  spacer.className = "course-spine-spacer";
  wrapper.parentNode.insertBefore(spacer, content);
  document.body.classList.add("has-course-spine");

  function positionSpine() {
    const header = document.querySelector("#quarto-header");
    const headerBottom = header ? Math.max(0, header.getBoundingClientRect().bottom) : 0;
    const stripHeight = wrapper.getBoundingClientRect().height;
    document.documentElement.style.setProperty("--course-spine-top", `${headerBottom}px`);
    document.documentElement.style.setProperty("--course-spine-height", `${stripHeight}px`);
    spacer.style.height = `${stripHeight}px`;
  }

  positionSpine();
  window.addEventListener("resize", positionSpine, { passive: true });
  window.addEventListener("load", positionSpine, { once: true });
  if (window.ResizeObserver) {
    const observer = new ResizeObserver(positionSpine);
    observer.observe(wrapper);
    const header = document.querySelector("#quarto-header");
    if (header) observer.observe(header);
  }

  function setActive(nextActive, nextPurpose = purpose) {
    active = nextActive;
    stageLinks.forEach((link, index) => {
      const number = index + 1;
      link.classList.toggle("is-active", number === active);
      link.classList.toggle("is-complete", active > 5 || number < active);
      link.classList.toggle("is-revisited", revisited.includes(number));
      if (number === active) link.setAttribute("aria-current", "step");
      else link.removeAttribute("aria-current");
    });

    const mobileLinks = mobileBody.querySelectorAll(".course-spine-stage");
    mobileLinks.forEach((link, index) => {
      const number = index + 1;
      link.classList.toggle("is-active", number === active);
      link.classList.toggle("is-complete", active > 5 || number < active);
      link.classList.toggle("is-revisited", revisited.includes(number));
    });

    const activeLabel = active >= 1 && active <= 5 ? stages[active - 1].short : "Construction complete";
    mobileSummary.textContent = `Course spine · ${activeLabel}${isDetail ? " · detail" : ""}`;
    why.innerHTML = `<strong>Why this is here:</strong> ${nextPurpose}`;
  }

  setActive(active);

}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initialiseCourseSpine, { once: true });
} else {
  initialiseCourseSpine();
}
</script>
