<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc"><title id="title">Three observed data types and corresponding filtered constructions</title><desc id="desc">A point cloud maps to a Rips complex, a weighted graph maps to a graph or clique complex, and a scalar grid maps to a cubical complex.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245b8a"/></marker><style>.line{stroke:#222;stroke-width:2;fill:none}.grid{stroke:#777;stroke-width:1;fill:none}.node{fill:#222}.face{fill:#dbe8f3;stroke:#245b8a;stroke-width:1.7}.head{font:20px Georgia,serif;fill:#111}.note{font:16px Georgia,serif;fill:#444}</style></defs><rect width="960" height="330" fill="#fff"/><g transform="translate(25 45)"><text class="head" x="55" y="0">point cloud</text><g class="node"><circle cx="40" cy="90" r="5"/><circle cx="85" cy="45" r="5"/><circle cx="145" cy="70" r="5"/><circle cx="170" cy="135" r="5"/><circle cx="75" cy="145" r="5"/></g><path d="M205 95 H260" stroke="#245b8a" marker-end="url(#a)"/><path class="face" d="M285 135 L330 45 L390 90 Z"/><circle class="node" cx="285" cy="135" r="5"/><circle class="node" cx="330" cy="45" r="5"/><circle class="node" cx="390" cy="90" r="5"/><text class="note" x="283" y="185">Rips complex</text></g><g transform="translate(505 45)"><text class="head" x="15" y="0">weighted graph</text><path class="line" d="M30 130 L90 45 L155 130 Z M90 45 L185 80"/><g class="node"><circle cx="30" cy="130" r="5"/><circle cx="90" cy="45" r="5"/><circle cx="155" cy="130" r="5"/><circle cx="185" cy="80" r="5"/></g><path d="M215 95 H270" stroke="#245b8a" marker-end="url(#a)"/><path class="face" d="M295 130 L355 45 L420 130 Z"/><path class="line" d="M355 45 L450 80"/><g class="node"><circle cx="295" cy="130" r="5"/><circle cx="355" cy="45" r="5"/><circle cx="420" cy="130" r="5"/><circle cx="450" cy="80" r="5"/></g><text class="note" x="286" y="185">graph or clique complex</text></g><g transform="translate(235 235)"><text class="head" x="0" y="0">scalar grid</text><g transform="translate(120 -35)"><path class="grid" d="M0 0 H120 V60 H0 Z M30 0 V60 M60 0 V60 M90 0 V60 M0 30 H120"/><rect x="60" y="0" width="30" height="30" fill="#8fb8d8"/><rect x="30" y="30" width="30" height="30" fill="#dbe8f3"/></g><path d="M280 -5 H335" stroke="#245b8a" marker-end="url(#a)"/><g transform="translate(360 -35)"><path class="grid" d="M0 0 H120 V60 H0 Z M30 0 V60 M60 0 V60 M90 0 V60 M0 30 H120"/><rect x="60" y="0" width="30" height="30" fill="#8fb8d8" stroke="#245b8a"/><rect x="30" y="30" width="30" height="30" fill="#dbe8f3" stroke="#245b8a"/></g><text class="note" x="371" y="54">cubical filtration</text></g></svg>
