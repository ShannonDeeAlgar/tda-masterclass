<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="title desc"><title id="title">Escalation map for dynamic persistence methods</title><desc id="desc">A decision tree selects ordinary persistence, zigzag persistence, multiparameter persistence, vineyards or labelled extensions according to how complexes and parameters change.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker><style>.box{fill:#fff;stroke:#245b8a;stroke-width:1.8}.q{fill:#eef4f8;stroke:#245b8a;stroke-width:1.8}.line{stroke:#555;stroke-width:1.4;fill:none;marker-end:url(#a)}.head{font:19px Georgia,serif;fill:#111}.note{font:15px Georgia,serif;fill:#444}</style></defs><rect width="980" height="430" fill="#fff"/><rect class="q" x="350" y="20" width="280" height="52"/><text class="head" x="385" y="52">How does the construction change?</text><path class="line" d="M490 72 V110 H135 V145 M490 110 H365 V145 M490 110 H615 V145 M490 110 H850 V145"/><rect class="q" x="30" y="145" width="210" height="58"/><text class="head" x="55" y="170">only grows</text><text class="note" x="55" y="190">one ordered scale</text><rect class="q" x="270" y="145" width="190" height="58"/><text class="head" x="291" y="170">grows and shrinks</text><rect class="q" x="510" y="145" width="210" height="58"/><text class="head" x="531" y="170">several parameters</text><rect class="q" x="760" y="145" width="190" height="58"/><text class="head" x="780" y="170">smoothly varying</text><path class="line" d="M135 203 V260 M365 203 V260 M615 203 V260 M855 203 V260"/><rect class="box" x="30" y="260" width="210" height="60"/><text class="head" x="52" y="288">ordinary persistence</text><rect class="box" x="270" y="260" width="190" height="60"/><text class="head" x="294" y="288">zigzag persistence</text><rect class="box" x="510" y="260" width="210" height="60"/><text class="head" x="528" y="288">multiparameter</text><text class="head" x="555" y="310">persistence</text><rect class="box" x="760" y="260" width="190" height="60"/><text class="head" x="805" y="288">vineyards</text><path class="line" d="M490 320 V365"/><rect class="q" x="340" y="365" width="300" height="48"/><text class="head" x="368" y="395">Do labels or types also matter?</text><text class="note" x="675" y="397">consider labelled/coloured extensions</text></svg>
