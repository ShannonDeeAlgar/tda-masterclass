<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 350" role="img" aria-labelledby="title desc">
<title id="title">Chain addition as symmetric difference</title><desc id="desc">Three four-edge graphs show chain a, chain b and a plus b. Blue selected edges shared by a and b cancel.</desc>
<defs><style>.base{stroke:#bbb;stroke-width:2;fill:none}.sel{stroke:#245b8a;stroke-width:5;fill:none}.node{fill:#fff;stroke:#222;stroke-width:1.8}.head{font:24px Georgia,serif;fill:#111}.note{font:17px Georgia,serif;fill:#333}</style></defs><rect width="1080" height="350" fill="#fff"/>
<g transform="translate(35 55)"><text class="head" x="55" y="0">a = (1,0,1,1)ᵀ</text><path class="base" d="M25 205 L120 45 L215 205 L25 205 M215 205 L285 245"/><path class="sel" d="M25 205 L120 45 M25 205 L215 205 M215 205 L285 245"/><g class="node"><circle cx="25" cy="205" r="6"/><circle cx="120" cy="45" r="6"/><circle cx="215" cy="205" r="6"/><circle cx="285" cy="245" r="6"/></g><text class="note" x="39" y="286">{e₀₁,e₀₂,e₂₃}</text></g>
<text class="head" x="352" y="180">+</text>
<g transform="translate(390 55)"><text class="head" x="55" y="0">b = (1,1,0,1)ᵀ</text><path class="base" d="M25 205 L120 45 L215 205 L25 205 M215 205 L285 245"/><path class="sel" d="M25 205 L120 45 M120 45 L215 205 M215 205 L285 245"/><g class="node"><circle cx="25" cy="205" r="6"/><circle cx="120" cy="45" r="6"/><circle cx="215" cy="205" r="6"/><circle cx="285" cy="245" r="6"/></g><text class="note" x="39" y="286">{e₀₁,e₁₂,e₂₃}</text></g>
<text class="head" x="707" y="180">=</text>
<g transform="translate(745 55)"><text class="head" x="33" y="0">a+b = (0,1,1,0)ᵀ</text><path class="base" d="M25 205 L120 45 L215 205 L25 205 M215 205 L285 245"/><path class="sel" d="M120 45 L215 205 M25 205 L215 205"/><g class="node"><circle cx="25" cy="205" r="6"/><circle cx="120" cy="45" r="6"/><circle cx="215" cy="205" r="6"/><circle cx="285" cy="245" r="6"/></g><text class="note" x="24" y="286">shared edges cancel</text></g>
</svg>
