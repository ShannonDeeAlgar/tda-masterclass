<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="title desc"><title id="title">Persistence-diagram matching including the diagonal</title><desc id="desc">Points in two persistence diagrams are matched across diagrams, while a short-lived feature is matched to the diagonal.</desc><defs><style>.axis{stroke:#222;stroke-width:1.6}.diag{stroke:#888;stroke-width:1.5;stroke-dasharray:6 5}.p{fill:#245b8a}.q{fill:#a13d3d}.match{stroke:#6b4ca5;stroke-width:1.8;stroke-dasharray:5 4}.head{font:21px Georgia,serif;fill:#111}.note{font:16px Georgia,serif;fill:#444}</style></defs><rect width="880" height="340" fill="#fff"/><g transform="translate(55 35)"><text class="head" x="75" y="0">diagram D</text><path class="axis" d="M20 250 V25 M20 250 H270"/><path class="diag" d="M20 250 L245 25"/><circle class="p" cx="80" cy="130" r="6"/><circle class="p" cx="150" cy="75" r="6"/><circle class="p" cx="190" cy="215" r="6"/><text class="note" x="117" y="280">birth</text><text class="note" x="-8" y="25">death</text></g><g transform="translate(500 35)"><text class="head" x="75" y="0">diagram E</text><path class="axis" d="M20 250 V25 M20 250 H270"/><path class="diag" d="M20 250 L245 25"/><circle class="q" cx="90" cy="140" r="6"/><circle class="q" cx="165" cy="88" r="6"/><text class="note" x="117" y="280">birth</text><text class="note" x="-8" y="25">death</text></g><path class="match" d="M135 165 C300 130 420 145 590 175 M205 110 C320 70 470 70 665 123"/><path class="match" d="M245 250 L270 225"/><text class="note" x="278" y="238">short feature matched to diagonal</text></svg>
