<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" role="img" aria-labelledby="title desc"><title id="title">From a time series to delay coordinates and a time-scale summary</title><desc id="desc">A scalar time series maps to a two-dimensional delay-coordinate point cloud, then repeated windowed persistence maps to a heat map with physical time and filtration scale axes.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245b8a"/></marker><style>.line{stroke:#222;stroke-width:2;fill:none}.axis{stroke:#222;stroke-width:1.5}.pt{fill:#245b8a}.head{font:20px Georgia,serif;fill:#111}.note{font:16px Georgia,serif;fill:#444}</style></defs><rect width="980" height="330" fill="#fff"/><g transform="translate(25 55)"><text class="head" x="45" y="0">scalar signal x(t)</text><path class="axis" d="M10 210 H260 M10 210 V25"/><path class="line" d="M10 140 C45 40 75 40 105 140 S165 240 195 140 S235 40 260 115"/></g><path d="M300 155 H360" stroke="#245b8a" stroke-width="1.8" marker-end="url(#a)"/><text class="note" x="302" y="140">delay map</text><g transform="translate(380 55)"><text class="head" x="35" y="0">(x(t),x(t−τ))</text><path class="axis" d="M10 210 H230 M10 210 V25"/><ellipse cx="120" cy="120" rx="80" ry="58" fill="none" stroke="#bbb"/><g class="pt"><circle cx="45" cy="120" r="4"/><circle cx="62" cy="82" r="4"/><circle cx="95" cy="64" r="4"/><circle cx="135" cy="66" r="4"/><circle cx="175" cy="88" r="4"/><circle cx="195" cy="125" r="4"/><circle cx="172" cy="166" r="4"/><circle cx="130" cy="180" r="4"/><circle cx="85" cy="168" r="4"/></g></g><path d="M650 155 H710" stroke="#245b8a" stroke-width="1.8" marker-end="url(#a)"/><text class="note" x="645" y="140">window + repeat</text><g transform="translate(735 55)"><text class="head" x="18" y="0">topology over (t,ε)</text><rect x="10" y="25" width="200" height="185" fill="#f2f2f2" stroke="#222"/><rect x="10" y="25" width="45" height="185" fill="#dbe8f3"/><rect x="55" y="70" width="55" height="140" fill="#8fb8d8"/><rect x="110" y="105" width="55" height="105" fill="#5b91bc"/><rect x="165" y="145" width="45" height="65" fill="#245b8a"/><text class="note" x="85" y="240">physical time t</text><text class="note" x="-25" y="25">ε</text></g></svg>
