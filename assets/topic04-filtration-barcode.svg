<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" role="img" aria-labelledby="title desc">
  <title id="title">Triangle filtration indexed by epsilon and its first-homology interval</title>
  <desc id="desc">At epsilon zero three vertices are present. At epsilon one two edges form a tree. At epsilon two the final edge creates a loop. At epsilon three a triangular face fills it. The H1 interval runs from epsilon two to epsilon three.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#666"/></marker>
    <style>
      .edge{stroke:#222;stroke-width:2.2;fill:none}.face{fill:#dbe8f3;stroke:#222;stroke-width:2.2}.node{fill:#222}
      .head{font:20px Georgia,serif;fill:#111}.note{font:16px Georgia,serif;fill:#444}.axis{stroke:#222;stroke-width:1.5}.bar{stroke:#245b8a;stroke-width:8}
    </style>
  </defs>
  <rect width="1040" height="380" fill="#fff"/>
  <g transform="translate(35 50)">
    <text class="head" x="18" y="0">ε = 0: vertices</text>
    <circle class="node" cx="40" cy="150" r="5"/><circle class="node" cx="165" cy="150" r="5"/><circle class="node" cx="102" cy="42" r="5"/>
  </g>
  <path d="M225 180 H270" stroke="#666" marker-end="url(#arrow)"/>
  <g transform="translate(280 50)">
    <text class="head" x="30" y="0">ε = 1: tree</text>
    <path class="edge" d="M40 150 L102 42 M40 150 L165 150"/>
    <circle class="node" cx="40" cy="150" r="5"/><circle class="node" cx="165" cy="150" r="5"/><circle class="node" cx="102" cy="42" r="5"/>
  </g>
  <path d="M470 180 H515" stroke="#666" marker-end="url(#arrow)"/>
  <g transform="translate(525 50)">
    <text class="head" x="10" y="0">ε = 2: loop born</text>
    <path class="edge" d="M40 150 L102 42 L165 150 Z"/>
    <circle class="node" cx="40" cy="150" r="5"/><circle class="node" cx="165" cy="150" r="5"/><circle class="node" cx="102" cy="42" r="5"/>
  </g>
  <path d="M715 180 H760" stroke="#666" marker-end="url(#arrow)"/>
  <g transform="translate(770 50)">
    <text class="head" x="2" y="0">ε = 3: loop filled</text>
    <path class="face" d="M40 150 L102 42 L165 150 Z"/>
    <circle class="node" cx="40" cy="150" r="5"/><circle class="node" cx="165" cy="150" r="5"/><circle class="node" cx="102" cy="42" r="5"/>
  </g>
  <line class="axis" x1="110" y1="306" x2="930" y2="306"/>
  <line class="axis" x1="110" y1="300" x2="110" y2="312"/><line class="axis" x1="370" y1="300" x2="370" y2="312"/>
  <line class="axis" x1="630" y1="300" x2="630" y2="312"/><line class="axis" x1="890" y1="300" x2="890" y2="312"/>
  <line class="bar" x1="630" y1="280" x2="890" y2="280"/>
  <text class="note" x="55" y="286">H₁</text><text class="note" x="104" y="336">0</text><text class="note" x="364" y="336">1</text>
  <text class="note" x="624" y="336">2</text><text class="note" x="884" y="336">3</text><text class="note" x="945" y="312">ε</text>
  <text class="note" x="604" y="365">birth</text><text class="note" x="864" y="365">death</text>
</svg>
