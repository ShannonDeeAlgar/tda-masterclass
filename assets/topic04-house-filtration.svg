<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">House filtration</title><desc id="desc">Four stages add outer edges, a roof-base edge and a triangular face.</desc>
  <defs><style>
    .panel{fill:#fbfbfa;stroke:#999;stroke-width:1.5}.edge{stroke:#333;stroke-width:4;stroke-linecap:round}.face{fill:#7d95b6;fill-opacity:.42}.v{fill:#fff;stroke:#333;stroke-width:2.5}
    .lab{font:18px Georgia,serif;fill:#222}.eps{font:20px Georgia,serif;fill:#255a92}.arrow{stroke:#777;stroke-width:2;fill:none}
  </style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#777"/></marker></defs>
  <g id="verts"><circle class="v" cx="140" cy="65" r="9"/><circle class="v" cx="220" cy="130" r="9"/><circle class="v" cx="220" cy="245" r="9"/><circle class="v" cx="60" cy="245" r="9"/><circle class="v" cx="60" cy="130" r="9"/></g>
  <g transform="translate(10 10)"><rect class="panel" width="270" height="310" rx="8"/><text class="eps" x="135" y="28" text-anchor="middle">ε = 0</text><use href="#verts"/><text class="lab" x="135" y="290" text-anchor="middle">five components</text></g>
  <path class="arrow" marker-end="url(#arrow)" d="M290 165 L320 165"/>
  <g transform="translate(330 10)"><rect class="panel" width="270" height="310" rx="8"/><text class="eps" x="135" y="28" text-anchor="middle">ε = 1</text><line class="edge" x1="140" y1="65" x2="220" y2="130"/><line class="edge" x1="220" y1="130" x2="220" y2="245"/><line class="edge" x1="220" y1="245" x2="60" y2="245"/><line class="edge" x1="60" y1="245" x2="60" y2="130"/><line class="edge" x1="60" y1="130" x2="140" y2="65"/><use href="#verts"/><text class="lab" x="135" y="290" text-anchor="middle">one outer cycle</text></g>
  <path class="arrow" marker-end="url(#arrow)" d="M610 165 L640 165"/>
  <g transform="translate(650 10)"><rect class="panel" width="270" height="310" rx="8"/><text class="eps" x="135" y="28" text-anchor="middle">ε = 2</text><line class="edge" x1="140" y1="65" x2="220" y2="130"/><line class="edge" x1="220" y1="130" x2="220" y2="245"/><line class="edge" x1="220" y1="245" x2="60" y2="245"/><line class="edge" x1="60" y1="245" x2="60" y2="130"/><line class="edge" x1="60" y1="130" x2="140" y2="65"/><line class="edge" x1="60" y1="130" x2="220" y2="130"/><use href="#verts"/><text class="lab" x="135" y="290" text-anchor="middle">roof and room cycles</text></g>
  <path class="arrow" marker-end="url(#arrow)" d="M930 165 L960 165"/>
  <g transform="translate(970 10)"><rect class="panel" width="220" height="310" rx="8"/><text class="eps" x="110" y="28" text-anchor="middle">ε = 3</text><polygon class="face" points="110,65 30,130 190,130"/><line class="edge" x1="110" y1="65" x2="190" y2="130"/><line class="edge" x1="190" y1="130" x2="190" y2="245"/><line class="edge" x1="190" y1="245" x2="30" y2="245"/><line class="edge" x1="30" y1="245" x2="30" y2="130"/><line class="edge" x1="30" y1="130" x2="110" y2="65"/><line class="edge" x1="30" y1="130" x2="190" y2="130"/><circle class="v" cx="110" cy="65" r="9"/><circle class="v" cx="190" cy="130" r="9"/><circle class="v" cx="190" cy="245" r="9"/><circle class="v" cx="30" cy="245" r="9"/><circle class="v" cx="30" cy="130" r="9"/><text class="lab" x="110" y="290" text-anchor="middle">room cycle survives</text></g>
</svg>
