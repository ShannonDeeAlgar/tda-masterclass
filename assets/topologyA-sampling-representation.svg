<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">From a possible continuous source to finite topological representations</title>
  <desc id="desc">A mug and torus represent possible continuous sources. Finite point samples do not contain the material between observations. Three neighbourhood scales produce isolated points, a loop-like complex and a filled complex.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#526273"/>
    </marker>
    <style>
      .panel{fill:#f8fafc;stroke:#a8b4c1;stroke-width:1.5}
      .heading{font:700 21px system-ui,sans-serif;fill:#243447}
      .label{font:600 16px system-ui,sans-serif;fill:#334155}
      .small{font:15px system-ui,sans-serif;fill:#526273}
      .tiny{font:13px system-ui,sans-serif;fill:#526273}
      .object{fill:#b9d5e8;stroke:#285f82;stroke-width:4}
      .sample{fill:#ffffff;stroke:#285f82;stroke-width:3}
      .edge{stroke:#285f82;stroke-width:3;fill:none}
      .face{fill:#9fc5df;fill-opacity:.55;stroke:#285f82;stroke-width:2}
      .ball{fill:#83b5d5;fill-opacity:.13;stroke:#4f8fb8;stroke-width:1.5}
      .arrow{stroke:#526273;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .accent{fill:#8b3f68}
    </style>
  </defs>

  <rect class="panel" x="20" y="20" width="280" height="560" rx="14"/>
  <rect class="panel" x="325" y="20" width="260" height="560" rx="14"/>
  <rect class="panel" x="610" y="20" width="570" height="560" rx="14"/>

  <text class="heading" x="45" y="58">1. Possible continuous source</text>
  <text class="small" x="45" y="84">A scientific model or hypothesis</text>

  <!-- solid handled mug -->
  <path class="object" d="M67 150 L67 278 Q67 316 112 316 L170 316 Q212 316 212 278 L212 150 Z"/>
  <ellipse class="object" cx="139.5" cy="150" rx="72.5" ry="18"/>
  <path d="M210 182 C274 174 278 278 213 273" fill="none" stroke="#285f82" stroke-width="22"/>
  <path d="M213 199 C251 195 251 254 214 252" fill="none" stroke="#f8fafc" stroke-width="10"/>
  <text class="label" x="111" y="346">mug</text>

  <!-- torus -->
  <ellipse class="object" cx="156" cy="449" rx="93" ry="60"/>
  <ellipse cx="156" cy="449" rx="39" ry="24" fill="#f8fafc" stroke="#285f82" stroke-width="4"/>
  <path d="M68 431 Q156 482 244 431" fill="none" stroke="#6f9fbd" stroke-width="3"/>
  <text class="label" x="132" y="535">torus</text>

  <path class="arrow" d="M292 300 L332 300"/>

  <text class="heading" x="350" y="58">2. Finite observations</text>
  <text class="small" x="350" y="84">Only sampled locations are stored</text>

  <!-- two stylised point samples -->
  <g transform="translate(0,2)">
    <circle class="sample" cx="383" cy="156" r="7"/><circle class="sample" cx="421" cy="137" r="7"/>
    <circle class="sample" cx="465" cy="136" r="7"/><circle class="sample" cx="505" cy="153" r="7"/>
    <circle class="sample" cx="527" cy="188" r="7"/><circle class="sample" cx="529" cy="234" r="7"/>
    <circle class="sample" cx="513" cy="278" r="7"/><circle class="sample" cx="473" cy="299" r="7"/>
    <circle class="sample" cx="427" cy="297" r="7"/><circle class="sample" cx="391" cy="276" r="7"/>
    <circle class="sample" cx="374" cy="234" r="7"/><circle class="sample" cx="375" cy="190" r="7"/>
    <circle class="sample" cx="510" cy="199" r="7"/><circle class="sample" cx="548" cy="186" r="7"/>
    <circle class="sample" cx="559" cy="222" r="7"/><circle class="sample" cx="545" cy="256" r="7"/>
    <text class="tiny" x="373" y="330">sample resembling a handled object</text>
  </g>

  <g>
    <circle class="sample" cx="455" cy="394" r="7"/><circle class="sample" cx="500" cy="409" r="7"/>
    <circle class="sample" cx="525" cy="446" r="7"/><circle class="sample" cx="516" cy="488" r="7"/>
    <circle class="sample" cx="480" cy="516" r="7"/><circle class="sample" cx="433" cy="514" r="7"/>
    <circle class="sample" cx="397" cy="486" r="7"/><circle class="sample" cx="389" cy="445" r="7"/>
    <circle class="sample" cx="411" cy="408" r="7"/>
    <text class="tiny" x="383" y="552">sample resembling a ring</text>
  </g>

  <path class="arrow" d="M577 300 L617 300"/>

  <text class="heading" x="635" y="58">3. Choose a neighbourhood scale and representation</text>
  <text class="small" x="635" y="84">The missing material is not supplied by the data</text>

  <!-- small scale -->
  <text class="label" x="650" y="125">small ε</text>
  <g transform="translate(700,195)">
    <circle class="ball" cx="0" cy="-58" r="18"/><circle class="ball" cx="50" cy="-30" r="18"/>
    <circle class="ball" cx="58" cy="25" r="18"/><circle class="ball" cx="20" cy="62" r="18"/>
    <circle class="ball" cx="-32" cy="51" r="18"/><circle class="ball" cx="-60" cy="5" r="18"/>
    <circle class="ball" cx="-44" cy="-43" r="18"/>
    <circle class="sample" cx="0" cy="-58" r="6"/><circle class="sample" cx="50" cy="-30" r="6"/>
    <circle class="sample" cx="58" cy="25" r="6"/><circle class="sample" cx="20" cy="62" r="6"/>
    <circle class="sample" cx="-32" cy="51" r="6"/><circle class="sample" cx="-60" cy="5" r="6"/>
    <circle class="sample" cx="-44" cy="-43" r="6"/>
  </g>
  <text class="small" x="640" y="286">isolated observations</text>
  <text class="accent" x="683" y="312" style="font:700 16px system-ui,sans-serif">β₀ = 7</text>

  <!-- intermediate scale -->
  <text class="label" x="835" y="125">moderate ε</text>
  <g transform="translate(895,195)">
    <path class="edge" d="M0 -58 L50 -30 L58 25 L20 62 L-32 51 L-60 5 L-44 -43 Z"/>
    <circle class="sample" cx="0" cy="-58" r="6"/><circle class="sample" cx="50" cy="-30" r="6"/>
    <circle class="sample" cx="58" cy="25" r="6"/><circle class="sample" cx="20" cy="62" r="6"/>
    <circle class="sample" cx="-32" cy="51" r="6"/><circle class="sample" cx="-60" cy="5" r="6"/>
    <circle class="sample" cx="-44" cy="-43" r="6"/>
  </g>
  <text class="small" x="820" y="286">one loop is supported</text>
  <text class="accent" x="871" y="312" style="font:700 16px system-ui,sans-serif">β₁ = 1</text>

  <!-- large scale -->
  <text class="label" x="1027" y="125">large ε</text>
  <g transform="translate(1080,195)">
    <path class="face" d="M0 -58 L50 -30 L58 25 L20 62 L-32 51 L-60 5 L-44 -43 Z"/>
    <path class="edge" d="M0 -58 L58 25 M0 -58 L20 62 M0 -58 L-32 51 M0 -58 L-60 5"/>
    <circle class="sample" cx="0" cy="-58" r="6"/><circle class="sample" cx="50" cy="-30" r="6"/>
    <circle class="sample" cx="58" cy="25" r="6"/><circle class="sample" cx="20" cy="62" r="6"/>
    <circle class="sample" cx="-32" cy="51" r="6"/><circle class="sample" cx="-60" cy="5" r="6"/>
    <circle class="sample" cx="-44" cy="-43" r="6"/>
  </g>
  <text class="small" x="1015" y="286">filled higher-order relations</text>
  <text class="accent" x="1055" y="312" style="font:700 16px system-ui,sans-serif">β₁ = 0</text>

  <path d="M650 355 H1140" stroke="#c6d0da" stroke-width="1.5"/>
  <text class="label" x="650" y="394">What the schematic establishes</text>
  <circle cx="662" cy="426" r="4" fill="#285f82"/>
  <text class="small" x="676" y="432">The continuous source is scientific context, not an observed data object.</text>
  <circle cx="662" cy="465" r="4" fill="#285f82"/>
  <text class="small" x="676" y="471">A bare finite sample does not contain paths between its observations.</text>
  <circle cx="662" cy="504" r="4" fill="#285f82"/>
  <text class="small" x="676" y="510">Neighbourhood scale and representation decide which gaps are bridged or filled.</text>
  <circle cx="662" cy="543" r="4" fill="#285f82"/>
  <text class="small" x="676" y="549">Persistence asks which inferred features survive across many scales.</text>
</svg>
